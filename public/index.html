<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Node.js Media Stream Test</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #1e1e24;
      color: #fff;
      padding: 2rem;
    }
    video{
      width: 720px;
      height: 720px;
    }
  </style>
</head>
<body>
  <h1>Node.js Media Server Running</h1>
  <p>Verifying MIME types, streaming, and CORS headers.</p>

  <h3>Audio Stream Test</h3>
  <audio controls preload="metadata">
    <source src="/sample.mp3" type="audio/mpeg">
    <source src="/sample.ogg" type="audio/ogg">
    Your browser does not support the audio element.
  </audio>

  
  <h3>Puppet Video</h3>
  <video controls preload="metadata">
    <source src="Chad.mp4" type="audio/mp4">
  </video>
  

  <h3>Puppet Audio</h3>
  <audio controls preload="metadata">
    <source src="take.wav" type="audio/wav">
  </audio>


  <script src="/app.js"></script>
</body>
</html>
